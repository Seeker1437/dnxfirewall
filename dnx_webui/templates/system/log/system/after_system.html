<script>
async function updateData(table_type) {
    let response = await ajaxClient.post('/get', { webui_table: `${table_type}` });

    if (response) {
        if (response.error) {
            console.log('[server/response]: ', response.message);
            return;
        }

        let rows = response.data;
        if (rows.length === 0) {
            console.log('No data!')
            return;
        }

        document.getElementById('filter-table-body').innerHTML = '';

        loadTableData(rows);
    }
}
</script>
